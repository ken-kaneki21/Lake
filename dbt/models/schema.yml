version: 2
models:
  - name: fct_trips
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: fare_amount
        data_tests: [not_null]
      - name: pickup_date
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_key
      - name: pu_zone_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: zone_id
  - name: dim_zone
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
