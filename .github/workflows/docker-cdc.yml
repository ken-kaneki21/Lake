name: PostgreSQL and CDC integration
on:
  push:
    branches: [main, feat/local-first]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-cdc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_FILE: docker/compose.source.yml:docker/compose.cdc.yml
      COMPOSE_PROJECT_NAME: paritylake-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare ephemeral development credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in PGPASSWORD CDC_PGPASSWORD MINIO_ROOT_USER MINIO_ROOT_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Set up Connect image builder
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      - name: Build and cache the verified Connect image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: docker/connect
          pull: true
          load: true
          tags: paritylake-connect:local
          cache-from: type=gha,scope=paritylake-connect
          cache-to: type=gha,scope=paritylake-connect,mode=min,ignore-error=true
      - name: Build and start the integration stack
        run: |
          docker compose --profile integration config --quiet
          docker compose --profile integration build --pull integration
          docker compose up -d --wait --wait-timeout 240 postgres kafka schema-registry connect
      - name: Provision raw CDC topics
        shell: bash
        run: |
          set -euo pipefail
          for entity in trips drivers zones; do
            docker compose exec -T kafka kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --partitions 1 --replication-factor 1 --topic "pg.app.$entity"
          done
      - name: Test source audit and Kafka CDC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          docker compose run --rm --no-deps -T integration python -m unittest discover -s tests -v 2>&1 | tee evidence/unit-tests.log
          docker compose run --rm --no-deps -T integration python -m tests.cdc_probe initial | tee evidence/cdc-initial.json
          docker compose restart connect
          docker compose up -d --wait --wait-timeout 180 connect
          docker compose run --rm --no-deps -T integration python -m tests.cdc_probe restart | tee evidence/cdc-restart.json
      - name: Build and smoke-test Spark image
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE="$COMPOSE_FILE:docker/compose.lake.yml"
          docker compose --progress plain --profile lake build --pull lake
          docker compose run --rm --no-deps -T --entrypoint /bin/sh lake -ec '
            conf="$(mktemp -d)"
            SPARK_CONF_DIR="$conf" /opt/spark/bin/spark-submit --master local[2] tests/lake_image_smoke.py
            version_status=0
            /bin/sh /opt/paritylake/run-dbt.sh --version || version_status=$?
            printf "dbt --version exit: %s\n" "$version_status"

            parse_status=0
            /bin/sh /opt/paritylake/run-dbt.sh --debug parse || parse_status=$?
            printf "dbt parse exit: %s\n" "$parse_status"

            manifest_status=0
            test -s /tmp/paritylake-dbt-target/manifest.json || manifest_status=$?
            printf "dbt manifest assertion exit: %s\n" "$manifest_status"

            if [ "$version_status" -ne 0 ]; then exit "$version_status"; fi
            if [ "$parse_status" -ne 0 ]; then exit "$parse_status"; fi
            exit "$manifest_status"
          ' 2>&1 | tee evidence/lake-image-smoke.log
      - name: Stream CDC into Iceberg and verify reconciliation
        shell: bash
        run: |
          set -euo pipefail
          lake_files="$COMPOSE_FILE:docker/compose.lake.yml"
          export COMPOSE_FILE="$lake_files"
          docker compose up -d --wait --wait-timeout 180 catalog
          for entity in trips drivers zones; do
            docker compose exec -T kafka kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --partitions 1 --replication-factor 1 --topic "relayed.app.$entity"
          done
          docker compose up -d relay
          docker compose run --rm --no-deps -T integration python -m tests.cdc_probe relay-baseline | tee evidence/relay-baseline.json
          checkpoint="s3a://checkpoints/ci-trips"
          lake() { docker compose run --rm --no-deps -T lake "$@"; }
          lake streaming/consume.py --prefix relayed --available-now --checkpoint "$checkpoint"
          lake tests/lake_probe.py baseline | tee evidence/lake-baseline.json
          docker compose stop catalog minio
          docker compose up -d --wait --wait-timeout 180 catalog
          lake tests/lake_probe.py drift | tee evidence/lake-drift.json
          docker compose run --rm --no-deps -T integration python -m tests.cdc_probe relay-update | tee evidence/relay-update.json
          lake streaming/consume.py --prefix relayed --available-now --checkpoint "$checkpoint"
          lake tests/lake_probe.py recovered | tee evidence/lake-recovered.json
          dbt() { docker compose run --rm --no-deps -T --entrypoint /bin/sh lake /opt/paritylake/run-dbt.sh "$@"; }
          dbt debug | tee evidence/dbt-debug.log
          dbt build --full-refresh | tee evidence/dbt-full-refresh.log
          dbt build | tee evidence/dbt-incremental.log
      - name: Validate and replay public TLC data
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps -T integration sh -ec '
            python -m source_db.download --month 2024-01 --output /tmp/tlc
            python -m source_db.seed --zones /tmp/tlc/taxi_zone_lookup.csv --drivers 20 >&2
            python -m replayer.replay --input-dir /tmp/tlc --month 2024-01 --rate 20 --speedup 60000 --limit 100
          ' | tee evidence/tlc-replay.jsonl
      - name: Collect runtime diagnostics
        if: always()
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/git-sha.txt
          docker version > evidence/docker-version.txt 2>&1
          COMPOSE_FILE="$COMPOSE_FILE:docker/compose.lake.yml" docker compose --profile lake --profile integration --profile relay ps -a > evidence/services.txt 2>&1
          COMPOSE_FILE="$COMPOSE_FILE:docker/compose.lake.yml" docker compose --profile lake --profile integration --profile relay logs --no-color --tail 250 2>&1 | python3 -m tests.redact_ci_logs > evidence/compose.log
      - name: Remove disposable job resources
        if: always()
        run: COMPOSE_FILE="$COMPOSE_FILE:docker/compose.lake.yml" docker compose --profile lake --profile integration --profile relay down --volumes --remove-orphans --timeout 15
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-cdc-evidence
          path: evidence/
          retention-days: 14
