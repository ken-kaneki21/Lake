services:
  postgres:
    image: postgres:16.13
    command: ["postgres", "-c", "wal_level=logical", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_DB: "${PGDATABASE:-app}"
      POSTGRES_USER: "${PGUSER:-paritylake}"
      POSTGRES_PASSWORD: "${PGPASSWORD:?set a development password in docker/.env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../source_db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
