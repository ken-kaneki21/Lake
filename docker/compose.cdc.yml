services:
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_LISTENERS: BROKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 8s
      retries: 18

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 4s
      retries: 24

  connect:
    image: paritylake-connect:local
    build:
      context: ./connect
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      PGDATABASE: ${PGDATABASE:-app}
      CDC_PGUSER: paritylake_cdc
      CDC_PGPASSWORD: ${CDC_PGPASSWORD:?set a development replication password}
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_LISTENERS: http://0.0.0.0:8083
      CONNECT_GROUP_ID: paritylake-connect
      CONNECT_CONFIG_STORAGE_TOPIC: paritylake-connect-config
      CONNECT_OFFSET_STORAGE_TOPIC: paritylake-connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: paritylake-connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/opt/connect-plugins
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 4s
      retries: 30

  integration:
    image: paritylake-integration:local
    profiles: ["integration"]
    build:
      context: ..
      dockerfile: docker/integration.Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-app}
      PGUSER: ${PGUSER:-paritylake}
      PGPASSWORD: ${PGPASSWORD:?set a development password}
      CDC_PGPASSWORD: ${CDC_PGPASSWORD:?set a development replication password}

  relay:
    image: paritylake-integration:local
    profiles: ["relay"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    command: ["python", "-m", "chaos.relay", "--db", "/var/lib/paritylake/relay.db", "forward"]
    volumes:
      - relay-data:/var/lib/paritylake
    mem_limit: 512m

volumes:
  relay-data:
  kafka-data:
