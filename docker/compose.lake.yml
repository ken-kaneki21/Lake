services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a local MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a local MinIO password}
    volumes:
      - minio-data:/data
    mem_limit: 1g

  buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment: &object-credentials
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set a local MinIO user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set a local MinIO password}
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 45); do
          if mc alias set local http://minio:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" &&
             mc mb --ignore-existing local/warehouse local/checkpoints; then
            exit 0
          fi
          sleep 2
        done
        exit 1

  catalog-init:
    image: busybox:1.37.0
    command: ["chown", "1000:1000", "/catalog"]
    volumes:
      - catalog-data:/catalog

  catalog:
    image: apache/iceberg-rest-fixture:1.9.2
    depends_on:
      buckets:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *object-credentials
      CATALOG_URI: jdbc:sqlite:/catalog/paritylake.db?journal_mode=WAL
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - catalog-data:/catalog
    mem_limit: 1g

  lake:
    profiles: ["lake"]
    build:
      context: ..
      dockerfile: docker/lake.Dockerfile
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      <<: *object-credentials
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-app}
      PGUSER: ${PGUSER:-paritylake}
      PGPASSWORD: ${PGPASSWORD:?set a development password}
      TZ: UTC
    volumes:
      - spark-ivy:/opt/paritylake/ivy
    mem_limit: 4g

volumes:
  minio-data:
  catalog-data:
  spark-ivy:
