services:
  object-store:
    image: &rustfs-image rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?set a local object-store user}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set a local object-store password}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs-data:/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  buckets:
    image: *rustfs-image
    depends_on:
      object-store:
        condition: service_healthy
    environment: &object-credentials
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set a local object-store user}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set a local object-store password}
      AWS_REGION: us-east-1
    volumes:
      - ./object-store.sh:/opt/paritylake/object-store.sh:ro
    entrypoint: ["/bin/sh", "/opt/paritylake/object-store.sh"]
    command: ["init"]

  catalog-init:
    image: busybox:1.37.0
    command: ["chown", "1000:1000", "/catalog"]
    volumes:
      - catalog-data:/catalog

  catalog:
    image: apache/iceberg-rest-fixture:1.9.2
    depends_on:
      buckets:
        condition: service_completed_successfully
      catalog-init:
        condition: service_completed_successfully
    environment:
      <<: *object-credentials
      CATALOG_URI: jdbc:sqlite:/catalog/paritylake.db?journal_mode=WAL
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://object-store:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      JAVA_TOOL_OPTIONS: -Xmx512m
    volumes:
      - catalog-data:/catalog
    mem_limit: 1g

  lake:
    profiles: ["lake"]
    build:
      context: ..
      dockerfile: docker/lake.Dockerfile
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      <<: *object-credentials
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE:-app}
      PGUSER: ${PGUSER:-paritylake}
      PGPASSWORD: ${PGPASSWORD:?set a development password}
      TZ: UTC
    volumes:
      - spark-ivy:/opt/paritylake/ivy
    mem_limit: 4g

volumes:
  rustfs-data:
  catalog-data:
  spark-ivy:
